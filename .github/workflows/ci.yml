name: CI Build

env:
  BuildDir: ./bld
  ScriptDir: ./scripts
  SrcDir: ./src
  Product: Chordious
  BinDir: ./src/Chordious.Core/bin
  SolutionFile: ./src/Chordious.sln

on:
  push:
    branches:
      - main
      - 2.6-official
      - 2.8-official
      - 'agent/**'

defaults:
  run:
    shell: pwsh

jobs:
  ci_build_and_test:
    name: CI Build and Test
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [Debug, Release]
    steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Checkout
      uses: actions/checkout@v6

    - name: Build Solution
      run: dotnet build --configuration ${{ matrix.configuration }} ${{ env.SolutionFile }}

    - name: Test Solution
      run: dotnet test --configuration ${{ matrix.configuration }} --no-build ${{ env.SolutionFile }}

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v6
      with:
        name:  ${{ matrix.configuration }}Binaries
        path: ${{ env.BinDir }}/${{ matrix.configuration }}/net8.0

  ci_build_windows:
    name: CI Windows Build
    runs-on: windows-latest
    needs: ci_build_and_test
    strategy:
      matrix:
        target: [Unpacked, WinX86, WinX64, WinArm64]
    steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Checkout
      uses: actions/checkout@v6

    - name: Build ${{ matrix.target }}
      run: ${{ env.ScriptDir }}/Build${{ matrix.target }}.ps1

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v6
      with:
        name: ${{ env.Product }}.${{ matrix.target }}
        path: ${{ env.BuildDir }}/${{ env.Product }}.${{ matrix.target }}.zip

  ci_build_windows_setup:
    name: CI Windows Setup Build
    runs-on: windows-latest
    needs: ci_build_and_test
    strategy:
      matrix:
        target: [WinX86.Setup, WinX64.Setup, WinArm64.Setup]
    steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Checkout
      uses: actions/checkout@v6

    - name: Build ${{ matrix.target }}
      run: ${{ env.ScriptDir }}/Build${{ matrix.target }}.ps1

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v6
      with:
        name: ${{ env.Product }}.${{ matrix.target }}
        path: ${{ env.BuildDir }}/${{ env.Product }}.${{ matrix.target }}/${{ env.Product }}.${{ matrix.target }}.msi
    
  ci_build_windows_winstore:
    name: CI Windows WinStore Build
    runs-on: windows-latest
    needs: ci_build_and_test
    if: ${{ github.repository == 'jonthysell/Chordious' || vars.ENABLE_WINSTORE_BUILD == 'true' }}
    env:
      CertFile: src\Chordious.WinStore\Chordious.WinStore_TemporaryKey.pfx
    strategy:
      matrix:
        target: [WinStore]
    steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v1.1

    - name: Checkout
      uses: actions/checkout@v6

    - name: Create Code Signing Certificate
      run: |
        Set-Content -Path cert.txt -Value '${{ secrets.WINSTORE_PFX }}'
        certutil -decode cert.txt ${{ env.CertFile }}
        Remove-Item cert.txt

    - name: Build ${{ matrix.target }}
      run: ${{ env.ScriptDir }}/Build${{ matrix.target }}.ps1
    
    - name: Cleanup Code Signing Certificate
      if: always()
      run: |
        Remove-Item ${{ env.CertFile }}

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v6
      with:
        name: ${{ env.Product }}.${{ matrix.target }}
        path: ${{ env.BuildDir }}/${{ env.Product }}.${{ matrix.target }}
    
  # ci_build_linux:
  #   name: CI Linux Build
  #   runs-on: ubuntu-latest
  #   needs: ci_build_and_test
  #   strategy:
  #     matrix:
  #       target: [Linux]
  #   steps:
  #   - name: Setup .NET
  #     uses: actions/setup-dotnet@v5
  #     with:
  #       dotnet-version: '8.0.x'

  #   - name: Checkout
  #     uses: actions/checkout@v6

  #   - name: Build ${{ matrix.target }}
  #     run: ${{ env.ScriptDir }}/Build${{ matrix.target }}.ps1

  #   - name: Upload Build Artifacts
  #     uses: actions/upload-artifact@v6
  #     with:
  #       name: ${{ env.Product }}.${{ matrix.target }}
  #       path: ${{ env.BuildDir }}/${{ env.Product }}.${{ matrix.target }}.tar.gz
  
  ci_build_macos:
    name: CI macOS Build and Test
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Checkout
      uses: actions/checkout@v6

    - name: Test Core
      run: dotnet test src/Chordious.CoreTest/Chordious.CoreTest.csproj --configuration Release

    - name: Test Desktop
      run: dotnet test src/Chordious.DesktopTest/Chordious.DesktopTest.csproj --configuration Release

    - name: Publish macOS Apple Silicon
      run: >-
        dotnet publish src/Chordious.Desktop/Chordious.Desktop.csproj
        --configuration Release
        --runtime osx-arm64
        --self-contained false
        --output bld/Chordious.osx-arm64

    - name: Upload macOS Build Artifact
      uses: actions/upload-artifact@v6
      with:
        name: Chordious.osx-arm64
        path: bld/Chordious.osx-arm64
